plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.atlasstream.tv'
    compileSdk 34

    defaultConfig {
        applicationId "uk.atlasstream.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ATLAS_STOREFILE") ?: "atlas.keystore")
            storePassword System.getenv("ATLAS_STOREPASS")
            keyAlias System.getenv("ATLAS_KEYALIAS")
            keyPassword System.getenv("ATLAS_KEYPASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
