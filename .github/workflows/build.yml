name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore atlas.keystore -alias atlas \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass atlasstream -keypass atlasstream \
            -dname "CN=ATLAS Stream, O=ATLAS, C=US"

      - name: Build release APK
        env:
          ATLAS_STOREFILE: ${{ github.workspace }}/atlas.keystore
          ATLAS_STOREPASS: atlasstream
          ATLAS_KEYALIAS: atlas
          ATLAS_KEYPASS: atlasstream
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/atlas-stream.apk
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ATLAS Stream TV v1.0.0
          files: out/atlas-stream.apk
